set -g status-bg '#ca9ee6'
set -g status-fg '#1e2030'

# Pass focus events to apps (lets Neovim autoread files changed on disk)
set -g focus-events on

# Thicker pane borders (tmux borders are text characters, so this is the heaviest line style)
set -g pane-border-lines heavy

# Selected pane border colour (keeps tmux's default yellow in copy mode, red when panes are synced)
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=##fe640b}}"
